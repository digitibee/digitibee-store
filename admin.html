
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Digitibee</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-image: url('walpaper-digitibee.JPG');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: #594653;
}

    header {
      background: #f8c9df;
      padding: 24px 20px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      color: #8d4269;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .welcome, .menu-card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 18px;
      box-shadow: 0 4px 15px #eacbdc55;
    }

    .menu-card h3 {
      margin-top: 0;
      color: #a64f7c;
    }

    .menu-card p {
      margin-bottom: 0;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #a17b91;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dashboard Digitibee</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Hai, Owner Yang cantik! 💗</h2>
    </section>

    <section class="menu-card">
      <h3>📦 Produk</h3>
    </section>

    <section class="menu-card">
      <h3>PESANAN</h3>
    </section>

    <section class="menu-card">
      <h3>PEMBAYARAN</h3>
    </section>

    <section class="menu-card">
      <h3>TESTIMONI</h3>
    </section>

    <section class="menu-card">
      <h3>LEADERBOARD</h3>
    </section>
  </main>

  <footer>
    © 2026 digitibee
  </footer>

</body>
</html>
