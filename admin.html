
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Digitibee</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-image: url('walpaper-digitibee.JPG');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: #594653;
}

    header {
      background: #f8c9df;
      padding: 24px 20px;
      text-align: center;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      margin: 0;
      color: #8d4269;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 16px;
    }

.welcome, .menu-card {
  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  padding: 14px 18px;
  margin-bottom: 12px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow: 0 4px 15px #eacbdc33;
}

  .menu-card h3 {
  margin: 0 0 8px;
  color: #a64f7c;
}

    .menu-card p {
      margin-bottom: 0;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #a17b91;
      font-size: 13px;
    }
    .login-box {
  max-width: 380px;
  margin: 35px auto;
  padding: 25px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 5px 20px #eacbdc55;
}

.login-box input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #e8b8d0;
  border-radius: 12px;
  font-size: 15px;
}

.login-box button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 12px;
  background: #d979a8;
  color: white;
  font-weight: bold;
  font-size: 15px;
}
    main, footer {
  display: none;
}
    .logout-area {
  text-align: center;
  padding: 15px;
}

.logout-area button {
  background: #f4a9c8;
  color: #713c56;
  border: none;
  border-radius: 14px;
  padding: 13px 35px;
  font-weight: bold;
  font-size: 14px;
}

.logout-area p {
  color: #a17b91;
  font-size: 12px;
}
  </style>
</head>

<body>

    <header>
    <h1>Dashboard Digitibee</h1>
  </header>

  <!-- FORM LOGIN ADMIN -->
  <section class="login-box" id="loginBox">
    <h2>Owner Login 🎀</h2>
    <p>Silakan masuk ke Dashboard Digitibee</p>

    <input type="email" id="adminEmail"
      placeholder="Email Admin">

    <input type="password" id="adminPassword"
      placeholder="Password">

    <button onclick="loginAdmin()">MASUK</button>

    <p id="loginMessage"></p>
  </section>

  <main>
    <section class="welcome">
      <h2>Hai, Owner Yang Cantik! 💗</h2>
    </section>

    
<section class="menu-card" id="productMenu">
  <h3>PRODUK</h3>
  <button onclick="showProductForm()">+ TAMBAH PRODUK</button>
  <div id="productList"></div>
</section>

<section class="menu-card" id="productForm" style="display:none;">

  <label>Foto Produk</label>
  <input type="file" id="productImage" accept="image/*">

  <label>Nama Produk</label>
  <input type="text" id="productName" placeholder="Nama produk">

  <label>Deskripsi</label>
  <textarea id="productDescription" placeholder="Deskripsi produk"></textarea>

  <label>Harga (Rp)</label>
  <input type="number" id="productPrice" min="0" placeholder="Harga">

  <label>Stok</label>
  <input type="number" id="productStock" min="0" value="0">

  <label>Kategori</label>
  <select id="productCategory">
    <option value="">Pilih kategori</option>
  </select>

  <label>Ketersediaan</label>
  <select id="productAvailability">
    <option value="ready_stock">READY STOCK</option>
    <option value="pre_order">PRE-ORDER</option>
    <option value="sold_out">SOLD OUT</option>
  </select>

  <button onclick="saveProduct()">SIMPAN PRODUK</button>
  <button onclick="hideProductForm()">BATAL</button>
  <p id="productMessage"></p>
</section>


    <section class="menu-card">
      <h3>PESANAN</h3>
    </section>

    <section class="menu-card">
      <h3>PEMBAYARAN</h3>
    </section>

    <section class="menu-card">
      <h3>TESTIMONI</h3>
    </section>

    <section class="menu-card">
      <h3>LEADERBOARD</h3>
    </section>
    </main>

  <section class="logout-area">
    <button onclick="logoutAdmin()"LOGOUT</button>
    <p>Terima kasih sudah mengelola digitibee ♡</p>
  </section>

  <footer>
    © 2026 digitibee
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0/dist/umd/supabase.min.js"></script>

<script>

  SUPABASE_KEY

</script>

<script>

async function loginAdmin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const message = document.getElementById('loginMessage');

  if (!email || !password) {
    message.textContent = 'Email dan password wajib diisi.';
    return;
  }

  message.textContent = 'Memeriksa akun...';

  let timeout;

  try {
    const result = await Promise.race([
      supabaseClient.auth.signInWithPassword({ email, password }),
      new Promise((_, reject) => {
        timeout = setTimeout(
          () => reject(new Error('timeout')),
          15000
        );
      })
    ]);

    clearTimeout(timeout);

    const { data, error } = result;

    if (error) {
      message.textContent = 'Login gagal: ' + error.message;
      return;
    }

    const { data: profile, error: profileError } = await supabaseClient.from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (profileError || profile?.role !== 'admin') {
      await supabaseClient.auth.signOut();
      message.textContent = 'Akun ini bukan Admin digitibee.';
      return;
    }

    document.getElementById('loginBox').style.display = 'none';
    document.querySelector('main').style.display = 'block';
    document.querySelector('footer').style.display = 'block';

 } catch (error) {
  clearTimeout(timeout);

  console.error('Login error:', error);

  message.textContent = 'Detail error: ' +
    (error?.message || String(error));
}
}


</script>
<script>
async function checkAdminSession() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
      return;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (profileError || profile?.role !== 'admin') {
      await supabaseClient.auth.signOut();
      return;
    }

    document.getElementById('loginBox').style.display = 'none';
    document.querySelector('main').style.display = 'block';
    document.querySelector('footer').style.display = 'block';

  } catch (error) {
    console.error('Session check error:', error);
  }
}

checkAdminSession();
  async function logoutAdmin() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert('Gagal logout. Silakan coba lagi.');
    return;
  }

  document.getElementById('loginBox').style.display = 'block';
  document.querySelector('main').style.display = 'none';
  document.querySelector('.logout-area').style.display = 'none';
  document.querySelector('footer').style.display = 'none';

  document.getElementById('adminPassword').value = '';
  document.getElementById('loginMessage').textContent =
    'Kamu berhasil logout. Sampai jumpa! 💗';
}
  
function showProductForm() {
  document.getElementById('productForm').style.display = 'block';
  loadCategories();
}

function hideProductForm() {
  document.getElementById('productForm').style.display = 'none';
}

async function loadCategories() {
  const select = document.getElementById('productCategory');

  const { data, error } = await supabaseClient
    .from('categories')
    .select('id, name')
    .order('name');

  if (error) {
    document.getElementById('productMessage').textContent =
      'Gagal memuat kategori: ' + error.message;
    return;
  }

  select.innerHTML = '<option value="">Pilih kategori</option>';

  (data || []).forEach(category => {
    const option = document.createElement('option');
    option.value = category.id;
    option.textContent = category.name;
    select.appendChild(option);
  });
}

async function saveProduct() {
  const message = document.getElementById('productMessage');
  const file = document.getElementById('productImage').files[0];

  const name = document.getElementById('productName').value.trim();
  const description = document.getElementById('productDescription').value.trim();
  const price = Number(document.getElementById('productPrice').value);
  const stock = Number(document.getElementById('productStock').value);
  const category = document.getElementById('productCategory').value;
  const availability = document.getElementById('productAvailability').value;

  if (!name || !file || !Number.isFinite(price) || price < 0 ||
      !Number.isInteger(stock) || stock < 0) {
    message.textContent = 'Lengkapi nama, foto, harga, dan stok dengan benar.';
    return;
  }

  if (!file.type.startsWith('image/')) {
    message.textContent = 'File harus berupa gambar.';
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    message.textContent = 'Ukuran foto maksimal 5 MB.';
    return;
  }

  message.textContent = 'Sedang mengunggah foto...';

  try {
    const extension = file.name.split('.').pop().toLowerCase();
    const filePath = Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + extension;

    const { error: uploadError } = await supabaseClient
      .storage
      .from('product-images')
      .upload(filePath, file, { upsert: false });

    if (uploadError) throw uploadError;

    const { data: imageData } = supabaseClient
      .storage
      .from('product-images')
      .getPublicUrl(filePath);

    const { error: insertError } = await supabaseClient
      .from('products')
      .insert({
        category_id: category || null,
        name: name,
        description: description,
        image_url: imageData.publicUrl,
        price: price,
        stock: stock,
        status: 'active',
        availability_type: availability
      });

    if (insertError) {
      await supabaseClient.storage
        .from('product-images')
        .remove([filePath]);
      throw insertError;
    }

    message.textContent = 'Produk berhasil disimpan! 🎀';

    document.getElementById('productImage').value = '';
    document.getElementById('productName').value = '';
    document.getElementById('productDescription').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productStock').value = '0';
    document.getElementById('productCategory').value = '';
    document.getElementById('productAvailability').value = 'ready_stock';

  } catch (error) {
    message.textContent = 'Gagal menyimpan produk: ' + error.message;
  }
}

</script>
</body>
</html>
