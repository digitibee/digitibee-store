<main>

<script>

async function loginAdmin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const message = document.getElementById('loginMessage');

  if (!email || !password) {
    message.textContent = 'Email dan password wajib diisi.';
    return;
  }

  message.textContent = 'Memeriksa akun...';

  let timeout;

  try {
    const result = await Promise.race([
      supabaseClient.auth.signInWithPassword({ email, password }),
      new Promise((_, reject) => {
        timeout = setTimeout(
          () => reject(new Error('timeout')),
          15000
        );
      })
    ]);

    clearTimeout(timeout);

    const { data, error } = result;

    if (error) {
      message.textContent = 'Login gagal: ' + error.message;
      return;
    }

    const { data: profile, error: profileError } = await supabaseClient.from('profiles')
      .select('role')
      .eq('id', data.user.id)
      .single();

    if (profileError || profile?.role !== 'admin') {
      await supabaseClient.auth.signOut();
      message.textContent = 'Akun ini bukan Admin digitibee.';
      return;
    }

    document.getElementById('loginBox').style.display = 'none';
    document.querySelector('main').style.display = 'block';
    document.querySelector('footer').style.display = 'block';

 } catch (error) {
  clearTimeout(timeout);

  console.error('Login error:', error);

  message.textContent = 'Detail error: ' +
    (error?.message || String(error));
}
}
  
</script>
<script>
async function checkAdminSession() {
  try {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
      return;
    }

    const user = data.session.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (profileError || profile?.role !== 'admin') {
      await supabaseClient.auth.signOut();
      return;
    }

    document.getElementById('loginBox').style.display = 'none';
    document.querySelector('main').style.display = 'block';
    document.querySelector('footer').style.display = 'block';

  } catch (error) {
    console.error('Session check error:', error);
  }

}
  checkAdminSession();
  async function logoutAdmin() {
  const { error } = await supabaseClient.auth.signOut();

  if (error) {
    alert('Gagal logout. Silakan coba lagi.');
    return;
  }

  document.getElementById('loginBox').style.display = 'block';
  document.querySelector('main').style.display = 'none';
  document.querySelector('.logout-area').style.display = 'none';
  document.querySelector('footer').style.display = 'none';

  document.getElementById('adminPassword').value = '';
  document.getElementById('loginMessage').textContent =
    'Kamu berhasil logout. Sampai jumpa! 💗';
}

function openMenuPage(pageId) {
  const pages = [
    'dashboardPage',
    'productPage',
    'addProductPage',
    'orderPage',
    'paymentPage',
    'testimonialPage',
    'leaderboardPage'
  ];

  pages.forEach(id => {
    const page = document.getElementById(id);
    if (page) {
      page.style.display = 'none';
    }
  });

  const targetPage = document.getElementById(pageId);

  if (targetPage) {
    targetPage.style.display = 'block';
  }

  if (pageId === 'productPage') } {
    loadProducts();
  }

function openProductPage() {
  openMenuPage('productPage');
}

let editingProductId = null;
  
async function editProduct(productId) {
  editingProductId = productId;

  const message = document.getElementById('productMessage');
  message.textContent = 'Memuat data produk...';

  try {
    const { data: product, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('id', productId)
      .single();

    if (error) throw error;

    const { data: variants, error: variantError } = await supabaseClient
      .from('product_variants')
      .select('*')
      .eq('product_id', productId);

    if (variantError) throw variantError;

    document.getElementById('productPage').style.display = 'none';
    document.getElementById('addProductPage').style.display = 'block';

    document.getElementById('productName').value = product.name || '';
    document.getElementById('productDescription').value =
      product.description || '';
    document.getElementById('productAvailability').value =
      product.availability_type || 'ready_stock';

    await loadCategories();

    document.getElementById('productCategory').value =
      product.category_id || '';

    const container = document.getElementById('variantList');
    container.innerHTML = '';

    (variants || []).forEach(variant => {
      addVariantRow();

      const rows = container.querySelectorAll('.variant-row');
      const row = rows[rows.length - 1];

      row.dataset.variantId = variant.id;
      
      row.querySelector('.variant-name').value = variant.name || '';
      row.querySelector('.variant-duration').value =
        variant.duration || 'Tanpa Durasi';
      row.querySelector('.variant-price').value = variant.price;
      row.querySelector('.variant-stock').value = variant.stock;
    });

    if (!variants || variants.length === 0) {
      addVariantRow();
    }

    message.textContent = 'Data produk berhasil dimuat.';

  } catch (error) {
    message.textContent = 'Gagal memuat produk: ' + error.message;
  }
}
async function loadProducts() {
  const container = document.getElementById('productList');

  container.innerHTML = '<p>Memuat produk...</p>';

  try {
    const { data: products, error } = await supabaseClient
      .from('products')
      .select('id, name, description, image_url, availability_type')
      .order('created_at', { ascending: false });

    if (error) throw error;

    container.innerHTML = '';

    if (!products || products.length === 0) {
      container.textContent = 'Belum ada produk. Silakan tambahkan produk pertama.';
      return;
    }

    for (const product of products) {
      const { data: variants, error: variantError } = await supabaseClient
        .from('product_variants')
        .select('id, name, duration, price, stock')
        .eq('product_id', product.id);

      if (variantError) throw variantError;

      const card = document.createElement('div');
      card.style.cssText =
        'background:rgba(255,255,255,.8);padding:15px;margin:15px 0;border-radius:16px;border:1px solid #efbfd5;';

      const title = document.createElement('h3');
      title.textContent = product.name;
      title.style.color = '#a64f7c';
      card.appendChild(title);

      if (product.image_url) {
        const img = document.createElement('img');
        img.src = product.image_url;
        img.alt = product.name;
        img.style.cssText =
          'width:100%;max-width:180px;height:140px;object-fit:contain;border-radius:12px;';
        card.appendChild(img);
      }

      const description = document.createElement('p');
      description.textContent = product.description || '';
      card.appendChild(description);

      const availability = document.createElement('p');
      availability.textContent =
        product.availability_type.replace('_', ' ').toUpperCase();
      card.appendChild(availability);

      const variantTitle = document.createElement('strong');
      variantTitle.textContent = 'Variasi Produk';
      card.appendChild(variantTitle);

      (variants || []).forEach(v => {
        const item = document.createElement('p');
        item.textContent =
          `${v.name} • ${v.duration || '-'} • Rp${Number(v.price).toLocaleString('id-ID')} • Stok: ${v.stock}`;
        card.appendChild(item);
      });

      const editButton = document.createElement('button');
editButton.textContent = 'EDIT PRODUK';
editButton.disabled = false;

editButton.addEventListener('click', () => {
  editProduct(product.id);
});

card.appendChild(editButton);
      container.appendChild(card);
    }

  } catch (error) {
    container.textContent = 'Gagal memuat produk: ' + error.message;
  }
}



function backToDashboard() {
  const pages = [
    'dashboardPage',
    'productPage',
    'addProductPage',
    'orderPage',
    'paymentPage',
    'testimonialPage',
    'leaderboardPage'
  ];

  pages.forEach(id => {
    const page = document.getElementById(id);
    if (page) {
      page.style.display = 'none';
    }
  });

  document.getElementById('dashboardPage').style.display = 'block';
}

function openAddProduct() {
  document.getElementById('productPage').style.display = 'none';
  document.getElementById('addProductPage').style.display = 'block';
  document.getElementById('productMessage').textContent = '';
  document.getElementById('variantList').innerHTML = '';
  addVariantRow();
  loadCategories();
}

function backToProductPage() {
  document.getElementById('addProductPage').style.display = 'none';
  document.getElementById('productPage').style.display = 'block';
}

function showProductForm() {
  document.getElementById('productForm').style.display = 'block';

  if (!document.querySelector('.variant-row')) {
    addVariantRow();
  }

  loadCategories();
}

function hideProductForm() {
  document.getElementById('productForm').style.display = 'none';
}

async function loadCategories() {
  const select = document.getElementById('productCategory');

  const { data, error } = await supabaseClient
    .from('categories')
    .select('id, name')
    .order('name');

  if (error) {
    document.getElementById('productMessage').textContent =
      'Gagal memuat kategori: ' + error.message;
    return;
  }

  select.innerHTML = '<option value="">Pilih kategori</option>';

  (data || []).forEach(category => {
    const option = document.createElement('option');
    option.value = category.id;
    option.textContent = category.name;
    select.appendChild(option);
  });
}

function addVariantRow() {
  const container = document.getElementById('variantList');

  const row = document.createElement('div');
  row.className = 'variant-row';
  row.style.cssText =
    'border:1px solid #e8b8d0;padding:12px;margin:12px 0;border-radius:12px;background:#fff9fc;';

  row.innerHTML = `
    <label>Jenis Akun / Variasi</label>
    <input type="text" class="variant-name"
      placeholder="Contoh: 1P1U">

    <label>Durasi</label>
    <select class="variant-duration">
      <option value="1 Hari">1 Hari</option>
      <option value="3 Hari">3 Hari</option>
      <option value="7 Hari">7 Hari</option>
      <option value="1 Bulan">1 Bulan</option>
      <option value="2 Bulan">2 Bulan</option>
      <option value="3 Bulan">3 Bulan</option>
      <option value="6 Bulan">6 Bulan</option>
      <option value="1 Tahun">1 Tahun</option>
      <option value="Tanpa Durasi">Tanpa Durasi</option>
    </select>

    <label>Harga (Rp)</label>
    <input type="number" class="variant-price"
      min="0" placeholder="Masukkan harga">

    <label>Stok</label>
    <input type="number" class="variant-stock"
      min="0" value="0">

    <button type="button" class="remove-variant"
      style="margin-top:10px;background:#f4a9c8;border:0;border-radius:10px;padding:9px;">
      HAPUS VARIASI
    </button>
  `;

  row.querySelector('.remove-variant').addEventListener('click', () => {
    row.remove();
  });

  container.appendChild(row);
}

async function saveProduct() {
  const message = document.getElementById('productMessage');
  const file = document.getElementById('productImage').files[0];

  const name = document.getElementById('productName').value.trim();
  const description = document.getElementById('productDescription').value.trim();
  const category = document.getElementById('productCategory').value;
  const availability = document.getElementById('productAvailability').value;

  const rows = [...document.querySelectorAll('.variant-row')];

  const variants = rows.map(row => ({
    id: row.dataset.variantId || null,
    name: row.querySelector('.variant-name').value.trim(),
    duration: row.querySelector('.variant-duration').value,
    price: Number(row.querySelector('.variant-price').value),
    stock: Number(row.querySelector('.variant-stock').value)
  }));

  const isEditing = editingProductId !== null;

  if (!name || (!isEditing && !file)) {
    message.textContent = 'Nama dan foto produk wajib diisi.';
    return;
  }

  if (file && (!file.type.startsWith('image/') ||
      file.size > 5 * 1024 * 1024)) {
    message.textContent = 'Pilih foto maksimal 5 MB.';
    return;
  }

  if (!variants.length || variants.some(v =>
    !v.name ||
    !Number.isFinite(v.price) ||
    v.price < 0 ||
    !Number.isInteger(v.stock) ||
    v.stock < 0
  )) {
    message.textContent =
      'Lengkapi jenis variasi, harga, dan stok setiap baris.';
    return;
  }

  message.textContent = 'Sedang menyimpan...';

  let uploadedFilePath = null;

  try {
    let imageUrl = null;

    if (file) {
      const extension = file.name.split('.').pop().toLowerCase();
      uploadedFilePath = Date.now() + '-' +
        Math.random().toString(36).slice(2) + '.' + extension;

      const { error: uploadError } = await supabaseClient.storage
        .from('product-images')
        .upload(uploadedFilePath, file, { upsert: false });

      if (uploadError) throw uploadError;

      const { data: imageData } = supabaseClient.storage
        .from('product-images')
        .getPublicUrl(uploadedFilePath);

      imageUrl = imageData.publicUrl;
    }

    let productId = editingProductId;

    if (isEditing) {
      const updateData = {
        category_id: category || null,
        name,
        description,
        price: 0,
        stock: 0,
        availability_type: availability
      };

      if (imageUrl) updateData.image_url = imageUrl;

      const { error } = await supabaseClient
        .from('products')
        .update(updateData)
        .eq('id', productId);

      if (error) throw error;

    } else {
      const { data: product, error } = await supabaseClient
        .from('products')
        .insert({
          category_id: category || null,
          name,
          description,
          image_url: imageUrl,
          price: 0,
          stock: 0,
          status: 'active',
          availability_type: availability
        })
        .select('id')
        .single();

      if (error) throw error;

      productId = product.id;
    }

    const { data: oldVariants, error: oldError } = await supabaseClient
      .from('product_variants')
      .select('id')
      .eq('product_id', productId);

    if (oldError) throw oldError;

    const variantData = variants.map(v => {
      const item = {
        product_id: productId,
        name: v.name,
        duration: v.duration,
        price: v.price,
        stock: v.stock
      };

      if (v.id) item.id = v.id;

      return item;
    });

    const { error: variantError } = await supabaseClient
      .from('product_variants')
      .upsert(variantData);

    if (variantError) throw variantError;

    const currentIds = variants
      .filter(v => v.id)
      .map(v => v.id);

    const removedIds = (oldVariants || [])
      .map(v => v.id)
      .filter(id => !currentIds.includes(id));

    if (removedIds.length > 0) {
      const { error: deleteError } = await supabaseClient
        .from('product_variants')
        .delete()
        .in('id', removedIds);
}
      if (deleteError) {
        throw new Error(
          'Data tersimpan, tetapi variasi yang dihapus belum berhasil dibersihkan: ' +
          deleteError.message
        );
      }

    message.textContent = isEditing
      ? 'Perubahan produk berhasil disimpan! 💗'
      : 'Produk berhasil ditambahkan! 💗';

    editingProductId = null;

    document.getElementById('productImage').value = '';
    document.getElementById('productName').value = '';
    document.getElementById('productDescription').value = '';
    document.getElementById('productCategory').value = '';
    document.getElementById('productAvailability').value = 'ready_stock';
    document.getElementById('variantList').innerHTML = '';

    document.getElementById('addProductPage').style.display = 'none';
    document.getElementById('productPage').style.display = 'block';

    await loadProducts();

  { catch (error) } {
    if (uploadedFilePath) {
      await supabaseClient.storage
        .from('product-images')
        .remove([uploadedFilePath]);
    }
  
    message.textContent = 'Gagal menyimpan: ' + error.message;
  }

</script>
